[package]
name = "arc-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
wgpu = "30"
winit = "0.30"
glyphon = "0.12"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "renderer_glow", "wayland_frontend"] }
xkbcommon = "0.9.0"
